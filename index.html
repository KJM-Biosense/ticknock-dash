<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticknock Lands - Biodiversity Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/dashboard.css?v=20260924b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="app">

  <main class="body">
    <div class="map-wrap">
      <div id="map" aria-label="Map of Ticknock Lands"></div>

      <div class="layer-panel" id="layerPanel">
        <div class="lp-head" id="lpHead" role="button" tabindex="0"><span>Layers</span><span class="lp-caret">▾</span></div>
        <button type="button" class="lp-close" id="lpClose" aria-label="Close layers">×</button>
        <div class="lp-list" id="layerList"></div>
      </div>
      <button type="button" class="layers-fab" id="layersFab"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>Layers</button>

      <div class="hl-bar" id="hlBar" role="status"><span id="hlText"></span><button type="button" id="hlClear">Clear</button></div>

      <div class="map-brand"><img src="assets/brand/biosense-logo-colour.png" alt="Biosense"></div>
      <div class="basemap-switcher">
        <button type="button" class="bm-btn bm-3d" id="introReplay" title="Replay the 3D site overview">3D</button>
        <span class="bm-sep"></span>
        <button type="button" class="bm-btn" data-bm="osm">Street</button>
        <button type="button" class="bm-btn active" data-bm="satellite">Satellite</button>
        <button type="button" class="bm-btn" data-bm="topo">Topo</button>
      </div>
    </div>

    <aside class="snapshot" id="snapshot" data-sheet="peek">
      <button type="button" class="sheet-handle" id="sheetHandle" aria-expanded="false"><span class="grip"></span><span class="sh-title"><img src="assets/icons/Biodiversity%20Snapshot%20Icon.png" alt="">Biodiversity snapshot</span><span class="sh-caret">▴</span></button>
      <div class="sp-brand"><img src="assets/brand/biosense-logo-colour.png" alt="Biosense"></div>
      <div class="sp-hdr"><img src="assets/icons/Biodiversity%20Snapshot%20Icon.png" alt=""><span>Biodiversity snapshot</span></div>
      <div class="sp-scroll" id="cards"></div>
    </aside>
  </main>
</div>

<!-- Expanded view -->
<div class="xv" id="xv" aria-hidden="true">
  <div class="xv-modal" role="dialog" aria-modal="true" aria-labelledby="xvTitle">
    <div class="xv-hdr"><span class="xv-dot" id="xvDot"></span><span class="xv-icon" id="xvIcon"></span><h2 id="xvTitle"></h2><button type="button" class="xv-close" id="xvClose" aria-label="Close">×</button></div>
    <div class="xv-body" id="xvBody"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>
  <div class="lb-stage">
    <div class="lb-frame"><img id="lbImg" alt="" hidden><video id="lbVideo" controls playsinline hidden></video></div>
    <div class="lb-cap"><div class="lb-title" id="lbTitle"></div><div class="lb-sub" id="lbSub"></div><div class="lb-credit" id="lbCredit"></div></div>
  </div>
</div>

<!-- 3D intro -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-globe" id="introGlobe"></div>
  <div class="intro-shade"></div>
  <div class="intro-copy">
    <h1>Explore Ticknock</h1>
    <p class="intro-sub">Explore the biodiversity of Hibernia's Ticknock landholdings, powered by Biosense</p>
    <div class="intro-loading"><span></span>Loading 3D view…</div>
    <button type="button" class="intro-go" id="introGo">Explore our Biodiversity</button>
  </div>
  <img class="intro-logo" src="assets/brand/biosense-logo-white.png" alt="Biosense">
  <button type="button" class="intro-skip" id="introSkip">Skip ›</button>
</div>

<script src="dashboard_data/data.js?v=20260924b"></script>
<script src="data/data_v2.js?v=20260924b"></script>
<script src="js/config.js?v=20260924b"></script>
<script src="js/core.js?v=20260924b"></script>
<script src="js/layers.js?v=20260924b"></script>
<script src="js/intro3d.js?v=20260924b"></script>
<script src="js/app.js?v=20260924b"></script>
</body>
</html>
